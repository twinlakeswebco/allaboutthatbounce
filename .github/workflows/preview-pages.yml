name: Publish frontend preview

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website files
        uses: actions/checkout@v4
        with:
          sparse-checkout: public
          sparse-checkout-cone-mode: false
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v5
